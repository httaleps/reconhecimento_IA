services:
  - type: web
    name: faceid-reconhecimento-facial
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: faces-storage
      mountPath: /opt/render/project/src/faces
      sizeGB: 1
